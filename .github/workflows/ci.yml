name: ci

on:
  push:
  workflow_dispatch:

jobs:
  tests:
    name: tests / ${{ matrix.fixture }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fixture: [basic, deviation, lifecycle, sticky-add]
    steps:
      - uses: actions/checkout@v4

      - name: Install Subversion
        run: sudo apt-get update -qq && sudo apt-get install -y -qq subversion

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: Run deterministic mirror tests
        run: .venv/bin/python tests/run_tests.py ${{ matrix.fixture }}
